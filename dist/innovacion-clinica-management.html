  // AI suggestion for the review queue: only the texts travel (no patient numbers, names or dates); a person accepts.
  async function suggestQueue() {
    const R = partesReportNow(); if (!R || !R.queue.length || S.aiBusy) return;
    const sample = await getSample();
    if (!sample) { S.aiMsg = L('The AI suggestion works when the app is opened on claude.ai.', 'La propuesta con IA funciona cuando la app se abre en claude.ai.'); render(); return; }
    S.aiBusy = true; S.aiMsg = ''; render();
    const items = R.queue.map((q) => ({ key: q.key, text: namesToNumbers(q.text, { strict: true }).text.replace(/\[\d+ pa(?:tients|cientes)[^\]]*\]|Nº\s?\d+/g, '[paciente]') }));
    const prompt = 'You classify short free-text notes written by the reception of a Spanish dental clinic in its daily sheets. Lines: G (general dentistry: check-ups, cleanings, fillings, root canals, extractions, x-rays, whitening), O (orthodontics: brackets, aligners, retainers), PF (fixed prosthesis: crowns, bridges, fixed prostheses on implants, night guards), PR (removable prosthesis: dentures and their repairs), IM (implants, implant surgery, bone grafts), NONE (not a treatment: notes, complaints, no-shows, payments). If the note is only a step of some treatment (a try-in "prueba", a delivery "entregar", "definitivo", taking impressions "medidas") and the line cannot be known without more context, answer "?". Answer only with JSON, an array like [{"i":0,"line":"PF","why":"motivo breve en español"}].\nNotes:\n' + items.map((x, i) => i + ': ' + x.text).join('\n');
    try {
      const res = await sample(prompt, { modelTier: 'quick', cache: false });
      const t = (res && res.text) || '', a = t.indexOf('['), b = t.lastIndexOf(']');
      const arr = a >= 0 && b > a ? JSON.parse(t.slice(a, b + 1)) : [];
      arr.forEach((x) => { const it = items[x.i]; if (it && ['G', 'O', 'PF', 'PR', 'IM', 'NONE', '?'].includes(x.line)) S.aiSuggest.set(it.key, { line: x.line, why: String(x.why || '').slice(0, 140) }); });
      S.aiMsg = L('Suggestions below. Accept or choose the line yourself.', 'Propuestas en la tabla. Acepta o elige tú la línea.');
    } catch (err) {
      const code = err && err.code;
      S.aiMsg = code === 'not_granted' ? L('The AI needs your permission; allow it when asked.', 'La IA necesita tu permiso; permítelo cuando te lo pida.') : code === 'rate_limited' ? L('Too many requests; try again in a minute.', 'Demasiadas peticiones; prueba en un minuto.') : L('The AI could not answer.', 'La IA no pudo responder.');
    }
    S.aiBusy = false; render();
  }

      tile(L('Marked "accepted" in MN', 'Marcado "aceptado" en MN'), pct0(F.acceptedShare), L('of the amount; all treated as accepted', 'del importe; se trata todo como aceptado')) +
      '</section>';
    const ageLbl = [L('0–3 months', '0–3 meses'), L('3–6 months', '3–6 meses'), L('6–12 months', '6–12 meses'), L('Over 12 months', 'Más de 12 meses')];
    const ageRows = Q.buckets.map((b, i) => ({ label: ageLbl[i], v: b.amount, sub: b.n + L(' lines', ' líneas'), hot: i >= 2 && b.amount > 0 }));
    const lineRows = IC.LINE_CODES.concat(['?']).filter((c) => Q.byLine[c] && Q.byLine[c].amount > 0).sort((a, b) => Q.byLine[b].amount - Q.byLine[a].amount).map((c) => ({ label: c === '?' ? L('? unclassified', '? sin clasificar') : c + ' · ' + IC.lineName(c), v: Q.byLine[c].amount, sub: Q.byLine[c].n + L(' lines', ' líneas') }));
    const grid = '<div class="grid2"><section class="card"><h2>' + L('How old it is', 'Antigüedad') + '</h2><p class="def">' + esc(IC.DEFINITIONS.pending) + '</p>' + hbars(ageRows, Math.max(1, ...ageRows.map((x) => x.v)), eur) + '</section>' +
      '<section class="card"><h2>' + L('By treatment line', 'Por línea de tratamiento') + '</h2><p class="def">' + L('Each description classified by the cleaning layer (PF fixed prosthesis, PR removable, IM implants, O orthodontics, G general).', 'Cada descripción clasificada por la capa de limpieza (PF prótesis fija, PR removible, IM implantes, O ortodoncia, G general).') + '</p>' + hbars(lineRows, Math.max(1, ...lineRows.map((x) => x.v)), eur) + '</section></div>';
    const oldRow = (x) => '<tr><td>' + esc(IC.dayLabel(x.day)) + '</td><td class="r">' + ageM(x.day) + '</td><td class="txt">' + esc(x.desc) + '</td><td class="num">' + esc(x.budget || '—') + '</td><td>' + esc(x.user || '—') + '</td><td class="r">' + eur(x.amount) + '</td></tr>';
    const oldHead = '<thead><tr><th>' + L('Date', 'Fecha') + '</th><th class="r">' + L('Months', 'Meses') + '</th><th>' + L('Treatment', 'Tratamiento') + '</th><th>' + L('Quote Nº', 'Nº presupuesto') + '</th><th>' + L('Doctor', 'Doctor') + '</th><th class="r">' + L('Amount', 'Importe') + '</th></tr></thead>';
    const old = '<section class="card"><h2>' + L('List to reconcile: older than 6 months', 'Lista para cuadrar: más de 6 meses') + '</h2><p class="def">' + L('Largest first. For each line, the accountant checks in MN (by quote number) whether the work was done and not entered — entering it lowers the figure — or the treatment is late, and then the patient is called.', 'De mayor a menor importe. Para cada línea, contabilidad comprueba en MN (por número de presupuesto) si el trabajo ya se hizo y no se metió —al meterlo, la cifra baja— o si el tratamiento va con retraso, y entonces se llama al paciente.') + '</p>' +
      (Q.old.length ? '<div class="tbl-wrap"><table>' + oldHead + '<tbody>' + Q.old.slice(0, 25).map(oldRow).join('') + '</tbody></table></div>' + (Q.old.length > 25 ? '<details class="more"><summary>' + L('See the other ', 'Ver las otras ') + (Q.old.length - 25) + L(' lines', ' líneas') + '</summary><div class="tbl-wrap"><table>' + oldHead + '<tbody>' + Q.old.slice(25).map(oldRow).join('') + '</tbody></table></div></details>' : '') +
        '<p class="note">' + esc(Q.old.length + L(' lines, ', ' líneas, ') + eur(Q.oldAmount) + '.') + '</p><div class="actions"><button class="btn primary" data-logpending="1">' + L('Log the decision to reconcile this list', 'Registrar la decisión de cuadrar esta lista') + '</button><span class="note">' + L('Measured by the pending amount older than 6 months at the next import.', 'Se mide con el pendiente de más de 6 meses en la siguiente importación.') + '</span></div>'
        : '<p class="sub">' + L('Nothing older than 6 months.', 'Nada con más de 6 meses.') + '</p>') + '</section>';
    const budgets = '<section class="card"><h2>' + L('Quotes with most pending', 'Presupuestos con más pendiente') + '</h2><div class="tbl-wrap"><table><thead><tr><th>' + L('Quote Nº', 'Nº presupuesto') + '</th><th class="r">' + L('Lines', 'Líneas') + '</th><th>' + L('Since', 'Desde') + '</th><th class="r">' + L('Amount', 'Importe') + '</th><th class="r">' + L('Share', 'Peso') + '</th></tr></thead><tbody>' +
      Q.topBudgets.map((b) => '<tr><td class="num">' + esc(b.budget) + '</td><td class="r">' + b.n + '</td><td>' + esc(IC.dayLabel(b.first)) + '</td><td class="r">' + eur(b.amount) + '</td><td class="r">' + pct0(b.amount / Q.total) + '</td></tr>').join('') + '</tbody></table></div></section>';
    const mn = '<section class="card"><h2>' + L('What MN does not record in this list', 'Lo que MN no registra en esta lista') + '</h2><div class="tbl-wrap"><table><tbody>' +
      '<tr><td>' + L('Lines with a payment linked', 'Líneas con un cobro ligado') + '</td><td class="r">' + pct0(F.collectedShare) + '</td></tr>' +
      '<tr><td>' + L('Amount with the quote marked as accepted', 'Importe con el presupuesto marcado como aceptado') + '</td><td class="r">' + pct0(F.acceptedShare) + '</td></tr>' +
      '<tr><td>' + L('Lines with the doctor recorded', 'Líneas con el doctor registrado') + '</td><td class="r">' + pct0(F.userShare) + '</td></tr>' +
      (F.sourceShare != null ? '<tr><td>' + L('Lines with how the patient found the clinic', 'Líneas con cómo conoció el paciente la clínica') + '</td><td class="r">' + pct0(F.sourceShare) + '</td></tr>' : '') +
      '</tbody></table></div><p class="note">' + L('Payments are not linked to treatments in MN, so the paid share of each line cannot be read from MN; the accountant reconciles it by hand.', 'En MN los cobros no se ligan a los tratamientos, así que lo cobrado de cada línea no se puede leer de MN; contabilidad lo cuadra a mano.') + '</p></section>';
    return head + tiles + likelyDoneCard() + grid + old + '<div class="grid2">' + budgets + mn + '</div>';
  }
  // First visits month by month (MN's patient files opened, or first-visit appointments), last 12 months.
  function firstVisitsCard(ds, k) {
    const months = []; for (let i = ds.lastMonth - 11; i <= ds.lastMonth; i++) months.push({ k: i, n: IC.firstVisits(ds, i) });
    if (!months.some((m) => m.n)) return '';
    const max = Math.max(1, ...months.map((m) => m.n)), cur = IC.firstVisits(ds, k), ly = IC.firstVisits(ds, k - 12);
    const avg6 = [1, 2, 3, 4, 5, 6].reduce((a, i) => a + IC.firstVisits(ds, k - i), 0) / 6;
    const ch = (a, b) => b ? '<span class="' + (a >= b ? 'good' : 'bad') + '">' + (a >= b ? '▲ ' : '▼ ') + Math.abs(Math.round((a / b - 1) * 100)) + '%</span>' : '';
    return '<section class="card"><h2>' + L('First visits per month', 'Primeras visitas por mes') + '</h2><p class="def">' +
      esc(IC.mkLabel(k)) + ': <b>' + cur + '</b> ' + ch(cur, avg6) + L(' vs the 6-month average (', ' frente a la media de 6 meses (') + Math.round(avg6) + ')' + (ly ? ' · ' + ch(cur, ly) + ' vs ' + esc(IC.mkLabel(k - 12, true)) + ' ' + Math.floor((k - 12) / 12) + ' (' + ly + ')' : '') +
      '. ' + L('Most first visits are free; some include a cleaning or a filling paid that day. Select a bar to change month.', 'La mayoría de primeras visitas son gratuitas; algunas incluyen una limpieza o un empaste que se cobra ese día. Pulsa una barra para cambiar de mes.') + '</p>' +
      '<div class="fv-bars" role="img" aria-label="' + esc(L('First visits per month, last 12 months', 'Primeras visitas por mes, últimos 12 meses')) + '">' +
      months.map((m) => '<button type="button" class="fvb' + (m.k === k ? ' cur' : '') + '" data-fvk="' + m.k + '" title="' + esc(IC.mkLabel(m.k) + ': ' + m.n) + '"><span class="fvn num">' + m.n + '</span><span class="fvbar" style="height:' + Math.max(3, 100 * m.n / max).toFixed(0) + '%"></span><span class="fvm">' + esc(IC.mkLabel(m.k, true)) + '</span></button>').join('') + '</div></section>';
  }
  // What needs a manager today, at the top of the overview: each item says what and opens the screen that handles it.
  function attentionStrip() {
    const ds = S.ds, items = [];
    const due = relevant().filter((d) => d.decision !== 'Rejected' && !d.outcome && ds.asOf >= IC.fromIso(d.reviewDay)).length;
    if (due) items.push({ go: 'decisions', tone: 'warn', n: due, text: L(due > 1 ? 'decisions are due for review' : 'decision is due for review', due > 1 ? 'decisiones toca revisar' : 'decisión toca revisar') });
    const recs = S.recs.filter((r) => !decisionFor(r)).length;
    if (recs) items.push({ go: 'recs', tone: 'accent', n: recs, text: L(recs > 1 ? 'recommendations waiting for a decision' : 'recommendation waiting for a decision', recs > 1 ? 'recomendaciones esperan una decisión' : 'recomendación espera una decisión') });
    const D = IC.pendingLikelyDone(ds);
    if (D.available && D.matches.length) items.push({ go: 'pending', tone: 'accent', n: eur(D.amount), text: L('pending in MN probably already done (' + D.matches.length + ' lines to enter)', 'pendientes en MN probablemente ya realizados (' + D.matches.length + ' líneas por introducir)') });
    const Q = IC.pendingReport(ds);
    if (Q && Q.oldAmount > 0) items.push({ go: 'pending', tone: 'warn', n: eur(Q.oldAmount), text: L('pending for more than 6 months (' + Q.old.length + ' lines)', 'pendientes desde hace más de 6 meses (' + Q.old.length + ' líneas)') });
    if (!items.length) return '';
    return '<section class="attn"><h2>' + L('Needs attention today', 'Lo que requiere atención hoy') + '</h2><div class="attn-list">' + items.map((x) => '<button class="attn-item ' + x.tone + '" data-go="' + x.go + '"><b class="num">' + esc(String(x.n)) + '</b><span>' + esc(x.text) + '</span><span class="attn-go" aria-hidden="true">›</span></button>').join('') + '</div></section>';
  }
  // Pending lines that the daily sheets show as already done: the accountant only has to enter them in MN.
  function likelyDoneCard() {
    const D = IC.pendingLikelyDone(S.ds);
    const head = '<section class="card likely"><h2>' + L('Probably already done', 'Probablemente ya realizado') + '</h2>';
    if (D.available === false) return head + '<p class="def">' + L('To find pending lines that the daily sheets already show as done, the pending export needs the patient number column ("Clientes.Número Cliente"). Add it to the MN template.', 'Para encontrar las líneas pendientes que los partes ya dan por hechas, la exportación de pendientes necesita la columna de número de paciente ("Clientes.Número Cliente"). Añádela a la plantilla de MN.') + '</p></section>';
    if (!D.matches.length) return head + '<p class="def">' + L('No pending line has a matching delivery in the daily sheets loaded.', 'Ninguna línea pendiente tiene una entrega que encaje en los partes cargados.') + '</p></section>';
    const row = (m) => '<tr><td>' + pat(m.item.pid) + '</td><td>' + esc(IC.dayLabel(m.item.day)) + '</td><td class="txt">' + esc(m.item.desc) + '</td><td class="r">' + eur(m.item.amount) + '</td><td>' + esc(IC.dayLabel(m.line.day)) + ' · ' + esc(m.line.doctor) + '</td><td class="txt">' + esc(m.line.desc) + '</td><td class="r">' + eur(m.line.realizada) + '</td><td><span class="pill ' + (m.confidence === 'high' ? 'ok' : 'medium') + '">' + (m.confidence === 'high' ? L('High', 'Alta') : L('Medium', 'Media')) + '</span></td></tr>';
    const th = '<thead><tr><th>' + L('Patient', 'Paciente') + '</th><th>' + L('Pending since', 'Pendiente desde') + '</th><th>' + L('Pending in MN', 'Pendiente en MN') + '</th><th class="r">' + L('Amount', 'Importe') + '</th><th>' + L('Daily sheet', 'Parte') + '</th><th>' + L('Written in the sheet', 'Escrito en el parte') + '</th><th class="r">' + L('Done', 'Realizado') + '</th><th>' + L('Match', 'Coincidencia') + '</th></tr></thead>';
    return head + '<p class="def">' + esc(L(D.matches.length + ' pending lines (' + eur(D.amount) + ') appear as done in a later daily sheet of the same patient. They are probably work done but not entered in MN: the accountant checks each one and enters it, and the pending figure falls.', D.matches.length + ' líneas pendientes (' + eur(D.amount) + ') aparecen como hechas en un parte posterior del mismo paciente. Probablemente es trabajo hecho y no introducido en MN: contabilidad comprueba cada una y la introduce, y el pendiente baja.')) + '</p>' +
      '<div class="tbl-wrap"><table>' + th + '<tbody>' + D.matches.slice(0, 15).map(row).join('') + '</tbody></table></div>' +
      (D.matches.length > 15 ? '<details class="more"><summary>' + L('See the other ', 'Ver las otras ') + (D.matches.length - 15) + L(' lines', ' líneas') + '</summary><div class="tbl-wrap"><table>' + th + '<tbody>' + D.matches.slice(15).map(row).join('') + '</tbody></table></div></details>' : '') +
      '<div class="actions"><button class="btn primary" data-logdone="' + D.matches.length + '">' + L('Log the decision to enter these lines in MN', 'Registrar la decisión de introducir estas líneas en MN') + '</button></div></section>';
  }

  // Patient base card for the overview: files, who has really been seen, who is due a recall, new files.

    const bars = '<div class="minibars" role="img" aria-label="' + esc(L('New patient files per month, last 24 months', 'Fichas nuevas por mes, últimos 24 meses')) + '">' + B.months.map((m) => '<span' + (m.k === S.k ? ' class="cur"' : '') + ' style="height:' + Math.max(2, 100 * m.n / max).toFixed(0) + '%" title="' + esc(IC.mkShortYear(m.k) + ': ' + m.n) + '"></span>').join('') + '</div>';
    const chg = y.change == null ? '' : ' (' + (y.change >= 0 ? '+' : '') + Math.round(y.change * 100) + '%)';

      '<tr><td>' + L('Seen in the last 12 months', 'Vistos en los últimos 12 meses') + '</td><td class="r"><b>' + B.active12.toLocaleString('es-ES') + '</b></td></tr>' +
      '<tr><td>' + L('Seen in the last 24 months', 'Vistos en los últimos 24 meses') + '</td><td class="r">' + B.active24.toLocaleString('es-ES') + '</td></tr>' +
      '<tr><td>' + L('No visit recorded', 'Sin ninguna visita registrada') + '</td><td class="r">' + B.noVisit.toLocaleString('es-ES') + '</td></tr>' +
      '<tr><td>' + L('With a next appointment', 'Con próxima cita') + '</td><td class="r">' + B.withNext.toLocaleString('es-ES') + '</td></tr>' +
      '<tr><td>' + L('Due a recall: seen in 12 months, no appointment', 'Para recordar revisión: vistos en 12 meses, sin cita') + '</td><td class="r"><b>' + B.recallN.toLocaleString('es-ES') + '</b></td></tr>' +
      '<tr><td>' + esc(L('New files ', 'Fichas nuevas ') + IC.mkLabel(y.from, true) + '–' + IC.mkLabel(y.to, true) + L(' against a year earlier', ' frente al año anterior')) + '</td><td class="r"><b>' + y.cur + '</b> / ' + y.prev + esc(chg) + '</td></tr>' +
      '</tbody></table></div>' + bars + '<p class="note">' + L('New patient files per month, last 24 months.', 'Fichas nuevas por mes, últimos 24 meses.') + '</p>' +
      (B.recall.length ? '<details class="more"><summary>' + L('See the 40 who have waited longest', 'Ver los 40 que más tiempo llevan sin venir') + '</summary><p class="ids">' + B.recall.slice(0, 40).map((r) => pat(r.patient) + ' <span class="note">' + esc(IC.dayLabel(r.last)) + '</span>').join(' · ') + '</p></details>' : '') + '</section>';

  function decisionFor(rec) { return relevant().find((d) => d.recId === rec.id); }
  const decisionLine = (d) => '<span class="pill ' + (d.decision === 'Rejected' ? 'neutral' : 'ok') + '">' + esc(decLabel(d.decision)) + '</span> ' + L('on ', 'el ') + esc(IC.dayLabel(IC.fromIso(d.decidedOn))) + (d.owner ? L(' · owner: ', ' · responsable: ') + esc(d.owner) : '') + (d.decision !== 'Rejected' ? L(' · review on ', ' · revisar el ') + esc(IC.dayLabel(IC.fromIso(d.reviewDay))) : '');
  function trackLine(t) {
    if (!t) return '';
    const parts = [t.decided + L(' decided before', ' decididas antes')];
    if (t.reviewed) parts.push(L(t.worked + ' of ' + t.reviewed + ' reviewed worked' + (t.partly ? ', ' + t.partly + ' partly' : ''), t.worked + ' de ' + t.reviewed + ' revisadas funcionaron' + (t.partly ? ', ' + t.partly + ' en parte' : '')));
    if (t.rejected) parts.push(t.rejected + L(' rejected', ' rechazadas'));
    return '<p class="note">' + L('Similar recommendations before: ', 'Recomendaciones parecidas antes: ') + esc(parts.join(' · ')) + '.</p>';
  }

  function viewRecs() {
    const ds = S.ds;
    const head = '<div class="page-head"><div><h1>' + L('Recommendations', 'Recomendaciones') + '</h1><p class="sub">' + L('From the data up to ', 'Con los datos hasta el ') + esc(IC.dayLabel(ds.asOf)) + L('. You decide. Each decision goes to the log and is checked against the next data import. Recommendations like the ones that worked before are listed first.', '. Tú decides. Cada decisión va al registro y se comprueba con la siguiente importación. Las recomendaciones parecidas a las que funcionaron antes aparecen primero.') + '</p></div></div>';
    if (!S.recs.length) return head + '<div class="empty">' + L('Nothing needs a decision in this data.', 'Nada requiere una decisión con estos datos.') + '</div>';
    return head + S.recs.map((r) => {
      const d = decisionFor(r), open = S.open && S.open.recId === r.id ? S.open : null;
      if (d) {
        return '<article class="rec decided"><h2>' + esc(r.title) + '</h2><p class="decided-line">' + decisionLine(d) + ' · <button class="btn quiet" data-go="decisions">' + L('See in Decisions', 'Ver en Decisiones') + '</button></p></article>';
      }
      const now = IC.evalMetric(ds, r.metric);
      let foot;
      if (open) {
        foot = '<div class="form">' +
          (open.mode === 'Modified' ? '<label>' + L('Your version of the action', 'Tu versión de la acción') + '<textarea id="fAction" rows="3">' + esc(r.action) + '</textarea></label>' : '') +
          (open.mode !== 'Rejected' ? '<div class="row"><label>' + L('Who is responsible', 'Responsable') + '<input id="fOwner" placeholder="' + L('e.g. Reception lead', 'p. ej. Jefa de recepción') + '"></label></div><div class="ql-field"><span>' + L('Check the result in', 'Revisar el resultado en') + '</span>' + reviewPicker('f') + '</div>' : '') +
          '<label>' + (open.mode === 'Rejected' ? L('Why not', 'Por qué no') : L('Note (optional)', 'Nota (opcional)')) + '<textarea id="fNote" rows="2"></textarea></label>' +
          '<div class="actions"><button class="btn primary" data-save="' + esc(r.id) + '">' + (open.mode === 'Rejected' ? L('Save rejection', 'Guardar rechazo') : L('Save decision', 'Guardar decisión')) + '</button><button class="btn quiet" data-cancel="1">' + L('Cancel', 'Cancelar') + '</button></div></div>';
      } else {
        foot = '<div class="actions"><button class="btn primary" data-decide="Accepted" data-rec="' + esc(r.id) + '">' + L('Accept', 'Aceptar') + '</button><button class="btn" data-decide="Modified" data-rec="' + esc(r.id) + '">' + L('Change', 'Modificar') + '</button><button class="btn danger" data-decide="Rejected" data-rec="' + esc(r.id) + '">' + L('Reject', 'Rechazar') + '</button></div>';
      }
      const ids = r.metric.type === 'prepaid_ids' ? '<details class="more"><summary>' + L('See the ', 'Ver los ') + r.metric.ids.length + L(' patients', ' pacientes') + '</summary><p class="ids">' + r.metric.ids.map((id) => pat(id)).join(' · ') + '</p></details>' : '';
      return '<article class="rec"><h2>' + esc(r.title) + '</h2><p>' + esc(r.evidence) + '</p>' +
        '<dl><dt>' + L('Suggested action', 'Acción propuesta') + '</dt><dd>' + esc(r.action) + '</dd><dt>' + L('Expected effect', 'Efecto esperado') + '</dt><dd>' + esc(r.impact) + '</dd><dt>' + L('Measured by', 'Se mide con') + '</dt><dd>' + esc(IC.metricLabel(r.metric)) + L(': now ', ': ahora ') + '<b class="num">' + fmt(now, r.metric.fmt) + '</b></dd></dl>' + trackLine(r.track) + ids + foot + '</article>';
    }).join('');
  }

  // What the app has learned from the log so far (feeds the next recommendations).
  function viewLearned() {
    const fu = S.learned && S.learned.followUp, m = S.model, pc = (x) => Math.round(x * 100) + '%';
    const items = [];
    if (fu && fu.callsRecorded) items.push(L(fu.callsRecorded + ' call results recorded; ' + pc(fu.bookedRate) + ' ended in a booking.', fu.callsRecorded + ' resultados de llamada anotados; el ' + pc(fu.bookedRate) + ' acabó en cita.'));
    if (fu && fu.observed) {
      let t = L('Of ' + fu.observed + ' patients on call lists at least four weeks ago, ' + pc(fu.continuedRate) + ' have continued their treatment. The next follow-up recommendation uses this rate.', 'De ' + fu.observed + ' pacientes en listas de llamada de hace al menos cuatro semanas, el ' + pc(fu.continuedRate) + ' ha continuado su tratamiento. La siguiente recomendación de seguimiento usa esta tasa.');
      if (fu.reachedRate != null && fu.notReachedRate != null) t += L(' Reached by phone: ' + pc(fu.reachedRate) + '. No answer: ' + pc(fu.notReachedRate) + '.', ' Contestaron: ' + pc(fu.reachedRate) + '. No contestaron: ' + pc(fu.notReachedRate) + '.');
      items.push(t);
    } else if (fu && fu.decisions) items.push(L('Follow-up results are measured four weeks after each call list; until then recommendations use a stated assumption.', 'Los resultados del seguimiento se miden cuatro semanas después de cada lista de llamadas; hasta entonces las recomendaciones usan una suposición declarada.'));
    const ex = S.learned && S.learned.expectations;
    if (ex && ex.n) {
      const r = ex.avgRealised;
      items.push(L('Your expectations: across ' + ex.n + ' logged decision' + (ex.n > 1 ? 's' : '') + ' with an expected result and at least a month of data, the measured change was on average ' + Math.round(r * 100) + '% of what was expected' + (r < 0.8 ? '. Expectations have been optimistic; consider smaller targets or a different action.' : r > 1.2 ? '. Results have beaten expectations.' : '.'),
        'Vuestras expectativas: en ' + ex.n + ' decisi' + (ex.n > 1 ? 'ones registradas' : 'ón registrada') + ' con resultado esperado y al menos un mes de datos, el cambio medido fue de media el ' + Math.round(r * 100) + '% de lo esperado' + (r < 0.8 ? '. Las expectativas han sido optimistas; conviene fijar metas menores o cambiar la acción.' : r > 1.2 ? '. Los resultados han superado lo esperado.' : '.')));

  const chipVal = (name) => { const b = document.querySelector('[data-group="' + name + '"] [aria-pressed="true"]'); return b ? b.dataset.chip : ''; };
  const KIND_WORDS = [['risk', /llamar|llamada|seguimiento|pendiente|cuadrar|recordatorio|whatsapp|\bsms\b|recuperar|abandon|call|follow|reconcil/],

    ['dentist', /contrat|doctor|doctora|dentista|odontolog|horario|jornada|turno|higienista|personal|hire|staff/],
    ['margin', /coste|costo|proveedor|laboratorio|material|gasto|ahorr|compra|margen|cost|supplier|lab\b/],
    ['line', /implant|ortodon|aligner|invisalign|bracket|protesis|blanque|limpieza|endodon|estetic|carilla|corona/]];
  const LINE_WORDS = [[/implant/, 'impl'], [/ortodon|aligner|invisalign|bracket|orto\b/, 'orto'], [/protesis fija|corona|puente|fija/, 'fija'], [/protesis|dentadura|removible|esquelet/, 'remov'], [/limpieza|higiene|periodon/, 'higi'], [/endodon|empaste|general|conservadora/, 'gener']];
  function guessKind(text) { const t = nrm(text); const hit = KIND_WORDS.find(([, re]) => re.test(t)); return hit ? hit[0] : null; }
  function guessMetric(kind, text) {
    const ds = S.ds, t = nrm(text || '');
    const line = (() => { const w = LINE_WORDS.find(([re]) => re.test(t)); return w ? ds.lineCats.find((c) => nrm(c).includes(w[1])) : null; })();

  function buildMetric(v) {

  // Every figure a decision can be followed with, for the AI to choose from.

      '.\nDecision: ' + d.title + '\nExpected result: ' + (d.expectText || '-') + '\nHow they will measure it: ' + (d.measureText || '-') + '\nAnswer only with JSON like {"metric":"new_patients"}, choosing the figure that best tracks the expected result.';

    const userEl = addMsg('user', typed);
    if (sent.swapped || sent.unclear) { const n = document.createElement('div'); n.className = 'sent-as'; n.textContent = L('Sent to the assistant as: ', 'Enviado al asistente como: ') + q; userEl.appendChild(n); }
    // Several patients for one name: list them here (names stay on this screen) so the manager can pick one.
    sent.matches.filter((m) => m.ids.length > 1).forEach((m) => {
      const box = document.createElement('div'); box.className = 'sent-as pick';
      const shown = m.ids.map((id) => ({ id, name: KEY.map.get(id) || '' })).sort((a, b) => a.name.localeCompare(b.name, 'es')).slice(0, 12);
      box.innerHTML = esc('«' + m.text + '» ' + L('matches ' + m.ids.length + ' patients', 'coincide con ' + m.ids.length + ' pacientes') + (m.ids.length > 12 ? L(' (first 12):', ' (primeros 12):') : ':')) + ' ' +
        shown.map((x) => '<button type="button" class="chip pick-pt" data-q="' + esc(typed.replace(m.text, x.name)) + '">' + esc(x.name) + ' · Nº ' + x.id + '</button>').join(' ');
      userEl.appendChild(box);
    });
    const bubble = addMsg('bot', L('Looking at the data…', 'Mirando los datos…'));
    const sample = await getSample();
    if (!sample) { bubble.innerHTML = md(L('The assistant works when this app is opened on claude.ai.', 'El asistente funciona cuando la app se abre en claude.ai.')); S.busy = false; return; }
    const hist = S.chat.slice(-6).map((m) => (m.role === 'user' ? 'Manager: ' : 'Assistant: ') + m.text).join('\n');
    const prompt = instructions() + (hist ? '\n\nConversation so far:\n' + hist : '') + '\n\nManager question: ' + q;
    try {
      const res = await sample(prompt, { tools: TOOLS, cache: false, onText: (u) => { if (u && u.text) { bubble.innerHTML = withNames(md(u.text)); $('#chatLog').scrollTop = $('#chatLog').scrollHeight; } } });
      const text = res && res.text ? res.text : L('No answer came back.', 'No ha llegado respuesta.');
      bubble.innerHTML = withNames(md(text));
      S.chat.push({ role: 'user', text: q }, { role: 'assistant', text });
    } catch (err) {
      const code = err && err.code;
      bubble.innerHTML = md(code === 'not_granted' ? L('The assistant needs your permission to answer. Allow it when asked, or from the artifact\'s permissions menu.', 'El asistente necesita tu permiso para responder. Permítelo cuando te lo pida o desde el menú de permisos del artefacto.') : code === 'rate_limited' ? L('Too many questions in a short time. Wait a minute and ask again.', 'Demasiadas preguntas en poco tiempo. Espera un minuto y vuelve a preguntar.') : L('The assistant could not answer: ', 'El asistente no pudo responder: ') + ((err && err.message) || L('unknown error', 'error desconocido')) + '.');
    }
    S.busy = false;
  }
  function showChips() { $('#chips').innerHTML = suggestions().map((s) => '<button class="chip" type="button">' + esc(s) + '</button>').join(''); }
  $('#askBtn').addEventListener('click', () => {
    const c = $('#chat'); c.hidden = !c.hidden;
    if (!c.hidden) {
      if (!$('#chatLog').children.length) addMsg('bot', L('Ask about any figure in the app. I read the same calculations you see and can explain them, compare periods or suggest a decision.', 'Pregunta por cualquier cifra de la app. Leo los mismos cálculos que ves y puedo explicarlos, comparar periodos o proponer una decisión.'));
      showChips();
      $('#chatIn').focus();
    }
  });
  $('#chatClose').addEventListener('click', () => { $('#chat').hidden = true; });
  $('#askFab').addEventListener('click', () => $('#askBtn').click());
  $('#chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) ask(b.textContent); });
  $('#chatLog').addEventListener('click', (e) => { const b = e.target.closest('.pick-pt'); if (b && !S.busy) ask(b.dataset.q); });
  $('#chatForm').addEventListener('submit', (e) => { e.preventDefault(); const q = $('#chatIn').value; $('#chatIn').value = ''; ask(q); });
  $('#chatIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chatForm').requestSubmit(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#chat').hidden = true; $('#imp').hidden = true; $('#unlock').hidden = true; $('#fb').hidden = true; } });

  // ---------- Start ----------
  applyStatic();
  Store.loadLocal();
  useSample(0);
  fillDataSelect();
  Store.init().then(() => { if (!S.open) render(); });
  fbInit();
  offerSaved();
})();
</script>
