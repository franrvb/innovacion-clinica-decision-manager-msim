<title>Innovación Clínica Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed brand bar, then one centred working column of cards; the assistant slides in from the right. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #17202a; --ink-2: #53616c; --line: #dce2e6;
  --accent: #178f8b; --accent-ink: #0c6865; --accent-soft: #e0f1f0; --bar: #cbd6db;
  --good: #2c7a4c; --bad: #b2452a; --warn: #9a6410; --brand: #1b1d29; --brand-ink: #f1f5f6; --brand-teal: #4dbcbc;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131a; --surface: #181c26; --ink: #e6ebee; --ink-2: #98a5af; --line: #283040;
  --accent: #4dbcbc; --accent-ink: #84d8d5; --accent-soft: #15302f; --bar: #384250;
  --good: #6cc191; --bad: #ef8b6c; --warn: #e0b35c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #181c26; --ink: #e6ebee; --ink-2: #98a5af; --line: #283040;
  --accent: #4dbcbc; --accent-ink: #84d8d5; --accent-soft: #15302f; --bar: #384250;
  --good: #6cc191; --bad: #ef8b6c; --warn: #e0b35c; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* Brand bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-teal); }
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
@media (max-width: 1140px) { .tabs { order: 3; flex-basis: 100%; } .top-actions { margin-left: auto; } }
.tab { background: none; border: 0; color: #b9c3c9; padding: 8px 12px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.tab[aria-current="page"] { color: #fff; background: rgba(77,188,188,.18); }
.tab .badge { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--brand-teal); color: var(--brand); font-size: 12px; text-align: center; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.data-sel { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: var(--brand-ink); border-radius: 8px; padding: 7px 8px; max-width: 230px; }
.data-sel option { color: #17202a; background: #fff; }
.btn-top { border: 1px solid rgba(255,255,255,.22); background: none; color: var(--brand-ink); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
.btn-ask { background: var(--brand-teal); color: var(--brand); border-color: var(--brand-teal); }

/* Page */
main { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.sub { color: var(--ink-2); font-size: 13px; margin: 4px 0 0; }
.month-nav { display: flex; gap: 6px; align-items: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.icon-btn:disabled { opacity: .35; cursor: default; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tile .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tile .val { font-size: 28px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tile .cmp { font-size: 13px; color: var(--ink-2); }
.good { color: var(--good); } .bad { color: var(--bad); } .flat { color: var(--ink-2); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.card h2 { font-size: 16px; font-weight: 700; }
.card .def { color: var(--ink-2); font-size: 13px; margin: -8px 0 0; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font: 11px var(--font); }
.chart .grid { stroke: var(--line); }
.chart .b { fill: var(--bar); cursor: pointer; } .chart .b.sel { fill: var(--accent); }
.chart .dot { fill: var(--ink); }

.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.hbar .track { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.hbar .fill.hot { background: var(--bad); }
.hbar .v { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.hbar .v small { color: var(--ink-2); margin-left: 6px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pid { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.high { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.medium { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.low, .pill.neutral { background: var(--accent-soft); color: var(--accent-ink); }
.pill.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.why { color: var(--ink-2); font-size: 13px; }
details.more { font-size: 13px; color: var(--ink-2); }
details.more summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; }
details.more p { margin: 8px 0 0; max-width: 75ch; }

/* Recommendations and decisions */
.intro { color: var(--ink-2); margin: 0; max-width: 75ch; }
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; }
.rec.decided { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.kind { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
.rec h2 { font-size: 18px; }
.rec p { margin: 0; max-width: 80ch; }
.rec dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.rec dt { color: var(--ink-2); font-size: 13px; font-weight: 600; padding-top: 1px; }
.rec dd { margin: 0; max-width: 75ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: var(--brand); } }
.btn.quiet { border-color: transparent; color: var(--ink-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
:root[data-theme="dark"] .btn.danger { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: var(--brand); } }
.form { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form input, .form select, .form textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-weight: 400; }
.form .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.decided-line { font-size: 14px; color: var(--ink-2); }
.ids { font-family: var(--mono); font-size: 12px; line-height: 1.8; }
.score { display: flex; gap: 10px; flex-wrap: wrap; }
.score div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.score b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.score span { font-size: 12px; color: var(--ink-2); }
.dec-metric { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 14px; align-items: baseline; }
.dec-metric b { font-variant-numeric: tabular-nums; }
.learned { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; max-width: 85ch; }
.call-sel { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--bg); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; color: var(--ink-2); text-align: center; }
.note { font-size: 12px; color: var(--ink-2); }

/* Assistant drawer */
.chat { position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--line);
  display: grid; grid-template-rows: auto 1fr auto auto; box-shadow: -12px 0 32px rgba(0,0,0,.12);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.chat-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-head b { font-size: 15px; }
.chat-log { overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
.msg { padding: 10px 12px; border-radius: 10px; max-width: 92%; font-size: 14px; }
.msg.user { background: var(--accent-soft); justify-self: end; }
.msg.bot { background: var(--bg); border: 1px solid var(--line); }
.msg.bot p { margin: 0 0 6px; } .msg.bot p:last-child { margin: 0; }
.msg.bot ul { margin: 4px 0 6px; padding-left: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 4px 10px; font-size: 13px; }
.chat-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px 6px; border-top: 1px solid var(--line); }
.chat-form textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: none; background: var(--bg); }
.chat .note { padding: 0 16px 12px; }

/* Import dialog */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10,14,20,.45); display: grid; place-items: center; padding: 16px; }
.modal-card { background: var(--surface); border-radius: 12px; padding: 22px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 12px; }
.modal-card h2 { font-size: 20px; }
.modal-card ul { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.modal-card p { margin: 0; }

@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .tabs { order: 3; flex-basis: 100%; overflow-x: auto; }
  .rec dl { grid-template-columns: minmax(0, 1fr); } .rec dt { padding-top: 6px; }
  .form .row { grid-template-columns: minmax(0, 1fr); }
  .hbar { grid-template-columns: 90px minmax(0, 1fr) auto; }
  .data-sel { max-width: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><rect x="2" y="1" width="2.4" height="28" fill="#4dbcbc"/><path d="M8 4.5 C13 1.2 19.5 1.4 24 5" fill="none" stroke="#4dbcbc" stroke-width="2.4"/><path d="M8 25.5 C13 28.8 19.5 28.6 24.5 24.6" fill="none" stroke="#4dbcbc" stroke-width="2.4"/></svg>
      <div>Innovación Clínica<small data-t="brandSub"></small></div>
    </div>
    <nav class="tabs" id="tabsNav">
      <button class="tab" data-tab="overview" data-t="tabOverview"></button>
      <button class="tab" data-tab="recs"><span data-t="tabRecs"></span><span class="badge" id="recBadge" hidden></span></button>
      <button class="tab" data-tab="decisions" data-t="tabDecisions"></button>
    </nav>
    <div class="top-actions">
      <select id="dataSel" class="data-sel"></select>
      <button id="importBtn" class="btn-top" data-t="import"></button>
      <button id="askBtn" class="btn-top btn-ask" data-t="ask"></button>
      <button id="langBtn" class="btn-top btn-lang"></button>
    </div>
  </div>
</header>

<main id="view"><p class="sub">…</p></main>

<aside id="chat" class="chat" hidden>
  <div class="chat-head"><b data-t="chatTitle"></b><button id="chatClose" class="btn quiet" data-t="close"></button></div>
  <div id="chatLog" class="chat-log"></div>
  <div id="chips" class="chips"></div>
  <form id="chatForm" class="chat-form">
    <textarea id="chatIn" rows="2"></textarea>
    <button class="btn primary" type="submit" data-t="send"></button>
  </form>

</aside>

<div id="imp" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <h2 id="impTitle" data-t="impTitle"></h2>
    <p data-t="impIntro"></p>
    <ul>
      <li data-t="impAppts" data-html="1"></li>
      <li data-t="impLines" data-html="1"></li>
      <li data-t="impPays" data-html="1"></li>
      <li data-t="impPatients" data-html="1"></li>
    </ul>
    <p class="note" data-t="impNote"></p>
    <input type="file" id="impFiles" multiple accept=".xlsx,.xls,.csv">
    <div id="impResult"></div>
    <div class="actions"><button id="impUse" class="btn primary" hidden data-t="impUse"></button><button id="impClose" class="btn" data-t="close"></button></div>
  </div>
</div>

<script>
/* Innovación Clínica · Management app — core logic (no UI).
   Sample data simulation, KPI engine, risk model, recommendations, import.
   Works in the browser (window.IC) and in Node (module.exports) for testing. */
(function (G) {
  'use strict';

  // ---------- Dates as UTC day numbers ----------
  const DAY = 86400000;
  const dn = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / DAY);
  const toDate = (n) => new Date(n * DAY);
  const mk = (n) => { const t = toDate(n); return t.getUTCFullYear() * 12 + t.getUTCMonth(); };
  const mkStart = (k) => dn(Math.floor(k / 12), (k % 12) + 1, 1);
  const mkEnd = (k) => mkStart(k + 1) - 1;
  const weekday = (n) => (toDate(n).getUTCDay() + 6) % 7; // 0 = Monday
  const iso = (n) => toDate(n).toISOString().slice(0, 10);
  const fromIso = (s) => { const [y, m, d] = s.split('-').map(Number); return dn(y, m, d); };
  // ---------- Language: Spanish for the clinic (default), English for the course ----------
  let LANG = 'es';
  const L = (en, es) => (LANG === 'es' ? es : en);
  const setLang = (l) => { LANG = l === 'en' ? 'en' : 'es'; };
  const getLang = () => LANG;
  const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MONTHS_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const WEEKDAYS_ES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const months = () => (LANG === 'es' ? MONTHS_ES : MONTHS_EN);
  const weekdayName = (w) => (LANG === 'es' ? WEEKDAYS_ES : WEEKDAYS)[w];
  const mkLabel = (k, short) => (short ? months()[k % 12].slice(0, 3) : months()[k % 12]) + (short ? '' : ' ' + Math.floor(k / 12));
  const mkShortYear = (k) => months()[k % 12].slice(0, 3) + ' ' + String(Math.floor(k / 12)).slice(2);
  const dayLabel = (n) => { const t = toDate(n), m = months()[t.getUTCMonth()].slice(0, 3); return t.getUTCDate() + ' ' + (LANG === 'es' ? m.toLowerCase() : m) + ' ' + t.getUTCFullYear(); };

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- Status vocabulary (mirrors MN Program agenda states) ----------
  // MN has these states, but reception today marks outcomes by colour instead: red "anula la consulta"
  // (cancelled or no-show, not told apart) and green "actuación realizada". ANNULLED is that red mark.
  const ST = {
    DONE: 'Realizada', REBOOKED: 'Cancelada refijada', CANCEL: 'Cancelada no refijada',
    NOSHOW: 'No llegó', ANNULLED: 'Anulada', FUTURE: 'Programada'
  };
  const isLost = (s) => s === ST.CANCEL || s === ST.NOSHOW || s === ST.ANNULLED;

  // ---------- Sample clinic (synthetic, sized like Innovación Clínica: ~€75k/month, 4 rooms, 7 dentists, 4 hygienists) ----------
  const PROFS = {
    imp: [{ name: 'Dra. Vega', cab: 'Gabinete 1' }],
    gen: [{ name: 'Dr. Sol', cab: 'Gabinete 2' }, { name: 'Dra. Prado', cab: 'Gabinete 2' }, { name: 'Dr. Lobo', cab: 'Gabinete 1' }, { name: 'Dra. Núñez', cab: 'Gabinete 2', from: dn(2026, 2, 1) }],
    orto: [{ name: 'Dra. Ruiz', cab: 'Gabinete 3' }],
    endo: [{ name: 'Dr. Marín', cab: 'Gabinete 3' }],
    hyg: [{ name: 'Hig. Lara', cab: 'Gabinete 4' }, { name: 'Hig. Paula', cab: 'Gabinete 4' }, { name: 'Hig. Irene', cab: 'Gabinete 4' }, { name: 'Hig. Marta', cab: 'Gabinete 3' }]
  };
  const CABS = ['Gabinete 1', 'Gabinete 2', 'Gabinete 3', 'Gabinete 4'];
  // cost: direct material / laboratory cost per treatment in 2023 euros (rises about 6% a year).
  const T = {
    limp: { name: 'LIMPIEZA', cat: 'Higiene', price: 50, cost: 3, role: 'hyg' },
    emp: { name: 'EMPASTE COMPOSITE', cat: 'Conservadora', price: 60, cost: 8, role: 'gen', tooth: true },
    endo: { name: 'ENDODONCIA', cat: 'Endodoncia', price: 180, cost: 20, role: 'endo', tooth: true },
    ext: { name: 'EXTRACCIÓN', cat: 'Cirugía', price: 50, cost: 5, role: 'gen', tooth: true },
    cordal: { name: 'EXTRACCIÓN CORDAL', cat: 'Cirugía', price: 90, cost: 10, role: 'imp', tooth: true },
    corona: { name: 'CORONA ZIRCONIO', cat: 'Prótesis', price: 380, cost: 130, role: 'gen', tooth: true },
    imp: { name: 'IMPLANTE', cat: 'Implantología', price: 900, cost: 260, role: 'imp', tooth: true },
    cimp: { name: 'CORONA SOBRE IMPLANTE', cat: 'Implantología', price: 500, cost: 170, role: 'imp', tooth: true },
    ferula: { name: 'FÉRULA DE DESCARGA', cat: 'Prótesis', price: 260, cost: 70, role: 'gen' },
    ortoIni: { name: 'ORTODONCIA · COLOCACIÓN', cat: 'Ortodoncia', price: 800, cost: 220, role: 'orto' },
    ortoRev: { name: 'REVISIÓN ORTODONCIA', cat: 'Ortodoncia', price: 60, cost: 4, role: 'orto' },
    ortoFin: { name: 'ORTODONCIA · RETIRADA', cat: 'Ortodoncia', price: 300, cost: 60, role: 'orto' },
    blanq: { name: 'BLANQUEAMIENTO', cat: 'Estética', price: 300, cost: 45, role: 'gen' },
    protRem: { name: 'PRÓTESIS REMOVIBLE', cat: 'Prótesis', price: 750, cost: 230, role: 'gen' },
    cur: { name: 'CURETAJE POR CUADRANTE', cat: 'Periodoncia', price: 70, cost: 5, role: 'hyg' }
  };
  // Events in the sample history that mirror the 2026 decisions described in the report.
  const EVENTS = {
    promoFrom: dn(2026, 3, 1), promoTo: dn(2026, 6, 30), // orthodontics and implant offer: 15% off
    reviewsFrom: dn(2026, 4, 1), // Google reviews incentive
    newDentist: dn(2026, 2, 1), // Dra. Núñez joins
    endoCut: dn(2026, 9, 1), // endodontist reduces hours
    referralEnd: dn(2026, 9, 1) // a referral agreement ends: fewer new patients

  function simulate(seed) {
    const r = rng(seed || 20261104);
    const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
    const START = dn(2023, 11, 1), END = dn(2027, 6, 1);
    const patients = [], appts = [], lines = [], pays = [];
    let planSeq = 1;

    const workday = (d) => { const w = weekday(d); return w === 5 ? d + 2 + ri(0, 4) : w === 6 ? d + 1 + ri(0, 4) : d; };
    const tooth = () => [1, 2, 3, 4][ri(0, 3)] * 10 + ri(1, 8);
    const payMethod = () => { const x = r(); return x < 0.6 ? 'Tarjeta' : x < 0.9 ? 'Efectivo' : 'Transferencia'; };
    const inflation = (d) => 1 + 0.06 * Math.max(0, (d - dn(2023, 1, 1)) / 365);
    const inPromo = (d) => d >= EVENTS.promoFrom && d <= EVENTS.promoTo;

    function pickProf(role, d) {

      const pr = list[ri(0, list.length - 1)];

      return { name: pr.name, cab };
    }
    function outcome(p, d) {
      const mon = weekday(d) === 0;

    }
    function addAppt(p, d, role, desc, type) {

      return { st, pr };
    }
    function makePlan(hint, d) {
      const promo = inPromo(d);
      let x = hint === 'orto' && r() < 0.6 ? 0.65 : hint === 'imp' && r() < 0.5 ? 0.55 : r();
      if (promo && r() < 0.18) x = r() < 0.5 ? 0.55 : 0.65; // the offer pulls demand to implants and orthodontics
      const S = (t, g1, g2) => ({ t, gap: ri(g1, g2), tooth: T[t].tooth ? tooth() : null });
      const s = [];
      if (x < 0.36) { if (r() < 0.4) s.push(S('limp', 0, 0)); const n = ri(1, 3); for (let i = 0; i < n; i++) s.push(S('emp', 7, 16)); }

      else if (x < 0.88) s.push(S('ferula', 10, 20));

  // Cut the simulated history at an export date, as an MN export would see it.

  function snapshot(full, asOf, label, decisions) {

      appts: full.appts.filter((a) => a.day <= H).map((a) => (a.day > asOf ? Object.assign({}, a, { status: ST.FUTURE }) : a)),

  // Sample data only: a patient whose call ended in "Booked" gets an appointment 7–20 days later and,

  function simulateCallEffects(ds, decisions) {
    let n = 0;
    for (const d of decisions || []) {
      if (d.kind !== 'risk' || !d.calls || d.decision === 'Rejected') continue;
      const d0 = fromIso(d.decidedOn);
      for (const [id, c] of Object.entries(d.calls)) {
        if (!c || c.result !== 'Booked') continue;
        const pid = Number(id), r = rng(pid * 7919 + d0);

        if (idx < 0) continue;
        const L = ds.lines[idx];
        if (day > ds.asOf) { ds.appts.push({ pid, day, prof: 'Dr. Sol', cab: 'Gabinete 2', desc: L.name, type: 'Tratamiento', status: ST.FUTURE }); n++; continue; }
        ds.appts.push({ pid, day, prof: 'Dr. Sol', cab: 'Gabinete 2', desc: L.name, type: 'Tratamiento', status: attends ? ST.DONE : ST.NOSHOW });
        if (attends) ds.lines[idx] = Object.assign({}, L, { status: 'Realizado', done: day, prof: 'Dr. Sol', cab: 'Gabinete 2', cost: Math.round(L.price * 0.27) });

      }
    }
    return n;
  }

  // Index by patient; sort by day.
  function prepare(ds) {

    ds.appts.forEach((a) => get(a.pid).appts.push(a));

    ds.pays.forEach((p) => get(p.pid).pays.push(p));

  // ---------- KPI engine (deterministic; the assistant only reads these) ----------

    let s = 0;

    return s;
  }

        const d = ds.firstVisitDay.get(a.pid); if (d == null || a.day < d) ds.firstVisitDay.set(a.pid, a.day);

  }
  const isHygienist = (name) => /^hig/i.test(String(name || ''));
  // Direct cost (materials and laboratory) of treatment done in the month; null when the data has no costs.
  function directCost(ds, k, filter) {
    let c = 0, any = false;
    for (const l of ds.lines) if (l.done != null && inMonth(l.done, k) && (!filter || filter(l))) { if (l.cost != null) { c += l.cost; any = true; } }
    return any ? c : null;
  }
  function marginPct(ds, k, filter) {
    let p = 0; for (const l of ds.lines) if (l.done != null && inMonth(l.done, k) && (!filter || filter(l))) p += l.price;

  // Treatment lines (categories) over k1..k2: count, production, margin, and change against the same months a year earlier.
  function treatmentLines(ds, k1, k2) {

  function series(ds, metric, n) {

    brandSub: L('Management', 'Gestión'), tabOverview: L('Overview', 'Resumen'), tabRecs: L('Recommendations', 'Recomendaciones'), tabDecisions: L('Decisions', 'Decisiones'),
    import: L('Import', 'Importar'), ask: L('Ask', 'Preguntar'), close: L('Close', 'Cerrar'), send: L('Send', 'Enviar'),
    chatTitle: L('Ask about the data', 'Pregunta sobre los datos'), chatNote: L('Figures come from the app\'s own calculations. Patients appear by number only.', 'Las cifras salen de los cálculos de la propia app. Los pacientes aparecen solo por número.'),
    impTitle: L('Import data', 'Importar datos'),
    impIntro: L('Export these lists from MN Program to Excel or CSV and select them together. The files are read in this browser and are not uploaded.', 'Exporta estas listas de MN Program a Excel o CSV y selecciónalas juntas. Los archivos se leen en este navegador y no se suben a ningún sitio.'),
    impAppts: L('<b>Appointments:</b> patient number, date, status or colour, professional, room, description', '<b>Agenda:</b> número de paciente, fecha, estado o color, profesional, gabinete, descripción'),
    impLines: L('<b>Treatments:</b> patient number, treatment, amount, status, date accepted, date done, room', '<b>Tratamientos:</b> número de paciente, tratamiento, importe, estado, fecha de aceptación, fecha de realización, gabinete'),
    impPays: L('<b>Payments:</b> patient number, payment date, amount, payment method', '<b>Cobros:</b> número de paciente, fecha de cobro, importe, forma de cobro'),
    impPatients: L('<b>Patients</b> (optional): patient number, registration date', '<b>Pacientes</b> (opcional): número de paciente, fecha de alta'),
    impNote: L('Patient names are not needed. Leave them out of the export if you can.', 'No hacen falta nombres de pacientes. Déjalos fuera de la exportación si puedes.'),
    impUse: L('Use this data', 'Usar estos datos')
  });
  function applyStatic() {
    const t = STATIC();
    document.documentElement.lang = IC.getLang();
    document.querySelectorAll('[data-t]').forEach((el) => { const v = t[el.dataset.t]; if (v == null) return; if (el.dataset.html) el.innerHTML = v; else el.textContent = v; });
    $('#tabsNav').setAttribute('aria-label', L('Sections', 'Secciones'));
    $('#dataSel').setAttribute('aria-label', L('Data source', 'Origen de los datos'));
    $('#chat').setAttribute('aria-label', L('Assistant', 'Asistente'));
    $('#chatIn').placeholder = L('Ask a question about the clinic\'s data', 'Haz una pregunta sobre los datos de la clínica');
    const lb = $('#langBtn');
    lb.textContent = IC.getLang() === 'es' ? 'EN' : 'ES';
    lb.title = IC.getLang() === 'es' ? 'Switch to English' : 'Cambiar a español';
    lb.setAttribute('aria-label', lb.title);
  }

  const SNAPS = [IC.dn(2026, 11, 3), IC.dn(2026, 12, 3), IC.dn(2027, 1, 4)];
  const snapLabel = (i) => L('Sample · ', 'Ejemplo · ') + IC.dayLabel(SNAPS[i]);
  const S = { full: null, ds: null, model: null, risk: [], dormant: null, recs: [], learned: null, k: 0, tab: 'overview', decisions: [], store: 'local', imported: null, sampleIdx: 0, open: null, openCalls: new Set(), chat: [], busy: false };

  // Labels for values stored in English in the decision log.
  const KIND_KEYS = ['risk', 'acq', 'pricing', 'dentist', 'line', 'margin'];
  const kindLabel = (k) => ({
    risk: L('Follow-up of paid treatments', 'Seguimiento de tratamientos pagados'), acq: L('Marketing', 'Marketing'), pricing: L('Pricing and promotions', 'Precios y promociones'),
    dentist: L('Hiring and dentist performance', 'Contratación y rendimiento'), line: L('Treatment lines', 'Líneas de tratamiento'), margin: L('Cost and margin', 'Costes y margen')
  })[k] || k;
  const decLabel = (v) => ({ Accepted: L('Accepted', 'Aceptada'), Modified: L('Changed', 'Modificada'), Rejected: L('Rejected', 'Rechazada') })[v] || v;
  const verdictLabel = (v) => ({ Worked: L('Worked', 'Funcionó'), Partly: L('Partly', 'En parte'), 'Did not work': L('Did not work', 'No funcionó') })[v] || v;
  const callLabel = (v) => ({ Booked: L('Booked', 'Cita reservada'), Declined: L('Declined', 'No quiere'), 'No answer': L('No answer', 'No contesta') })[v] || v;

  // ---------- Data ----------
  const sampleLabel = () => L('Sample data (synthetic patients)', 'Datos de ejemplo (pacientes ficticios)');
  // Decisions made on the data currently loaded (sample decisions never mix with imported data).
  const relevant = () => S.decisions.filter((d) => (d.source || 'sample') === (S.ds ? S.ds.source : 'sample'));
  const sampleSnapshot = (i) => IC.snapshot(S.full, SNAPS[i], sampleLabel(), S.decisions.filter((d) => (d.source || 'sample') === 'sample'));
  function useSample(i) {
    if (!S.full) S.full = IC.simulate();
    S.sampleIdx = i;
    setDataset(sampleSnapshot(i));
  }
  function setDataset(ds) {
    S.ds = ds; S.k = ds.lastMonth;
    recompute(); render();
  }
  // The model layer: retrain the risk model (with call results as a feature), learn from the
  // decision log, and regenerate the recommendations.
  function recompute() {
    const dec = relevant(), contacts = IC.contactsFrom(dec);
    S.model = IC.trainRisk(S.ds, contacts);
    S.risk = IC.riskList(S.ds, S.model, contacts);
    S.dormant = IC.dormantPlans(S.ds);
    S.learned = IC.learnFromDecisions(S.ds, dec);
    S.recs = IC.recommendations(S.ds, S.model, S.risk, S.learned);
  }
  let changeTimer = null;
  function decisionsChanged() {
    clearTimeout(changeTimer);
    changeTimer = setTimeout(() => {
      if (!S.ds) return;
      const k = S.k;
      if (S.ds.source === 'sample' && S.full) S.ds = sampleSnapshot(S.sampleIdx);
      S.k = Math.min(k, S.ds.lastMonth);
      recompute(); renderSoon();
    }, 400);
  }
  function fillDataSelect() {
    const sel = $('#dataSel');
    const opts = SNAPS.map((s, i) => '<option value="s' + i + '">' + esc(snapLabel(i)) + '</option>');
    if (S.imported) opts.unshift('<option value="imp">' + esc(L('Imported · up to ', 'Importado · hasta ') + IC.dayLabel(S.imported.asOf)) + '</option>');
    sel.innerHTML = opts.join('');
    sel.value = S.ds && S.ds.source === 'import' ? 'imp' : 's' + S.sampleIdx;
  }
  $('#dataSel').addEventListener('change', (e) => {
    const v = e.target.value;
    if (v === 'imp') setDataset(S.imported); else useSample(+v.slice(1));
  });
  // Switching language rebuilds every generated text (recommendations, reasons, labels) in the new language.
  $('#langBtn').addEventListener('click', () => {
    IC.setLang(IC.getLang() === 'es' ? 'en' : 'es');
    try { localStorage.setItem('ic-lang', IC.getLang()); } catch (e) { /* storage unavailable */ }
    applyStatic();
    if (!S.ds) return;
    const k = S.k;
    if (S.ds.source === 'sample' && S.full) S.ds = sampleSnapshot(S.sampleIdx);
    fillDataSelect();
    recompute(); S.k = Math.min(k, S.ds.lastMonth); S.open = null; render();
    if (!$('#chat').hidden) showChips();
  });

  // ---------- Decision log (shared through the artifact database when available) ----------
  const Store = {
    db: null,
    loadLocal() { try { S.decisions = JSON.parse(localStorage.getItem('ic-decisions') || '[]'); } catch (e) { S.decisions = []; } },
    saveLocal() { try { localStorage.setItem('ic-decisions', JSON.stringify(S.decisions)); } catch (e) { /* storage unavailable */ } },
    async init() {
      this.loadLocal();
      if (!window.claude || !window.claude.use) return;
      let db = null;
      try { db = await window.claude.use('db'); } catch (e) { db = null; }
      if (!db) return;
      this.db = db;
      const timer = setTimeout(() => { if (S.store !== 'shared') render(); }, 10000);
      db.collection('decisions').onSnapshot((snap) => {
        clearTimeout(timer);
        S.store = 'shared';
        S.decisions = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        decisionsChanged();
      }, () => { clearTimeout(timer); this.db = null; S.store = 'local'; this.loadLocal(); decisionsChanged(); });
    },
    async add(d) {
      if (this.db) { await this.db.collection('decisions').add(d); return; }
      d.id = 'l' + Date.now(); S.decisions.push(d); this.saveLocal(); decisionsChanged();
    },
    async update(id, patch) {
      if (this.db) { await this.db.collection('decisions').doc(id).update(patch); return; }
      const d = S.decisions.find((x) => x.id === id); if (d) Object.assign(d, patch); this.saveLocal(); decisionsChanged();
    }
  };
  let pendingRender = false;
  function renderSoon() { if (S.open) { pendingRender = true; return; } render(); }

  // ---------- Small render helpers ----------
  function delta(cur, prev, upIsGood, label) {
    if (!prev) return '<span class="flat">' + L('no comparison', 'sin comparación') + '</span>';
    const ch = cur / prev - 1;
    if (Math.abs(ch) < 0.005) return '<span class="flat">= ' + esc(label) + '</span>';
    const good = upIsGood == null ? 'flat' : (ch > 0) === upIsGood ? 'good' : 'bad';
    return '<span class="' + good + '">' + (ch > 0 ? '▲ ' : '▼ ') + Math.abs(ch * 100).toFixed(0) + '%</span> ' + esc(label);
  }
  function barChart(rows, selK) {
    const W = 680, H = 230, L0 = 46, B = 26, T = 10, R = 8;
    const max = Math.max(1, ...rows.map((r) => Math.max(r.p, r.c)));
    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].find((x) => x * mag >= raw) * mag;
    const top = Math.ceil(max / step) * step, nLines = Math.round(top / step);
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const bw = (W - L0 - R) / rows.length;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(L('Production and collections by month', 'Producción y cobros por mes')) + '">';
    for (let i = 0; i <= nLines; i++) {
      const v = step * i;
      s += '<line class="grid" x1="' + L0 + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
      s += '<text x="' + (L0 - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (v >= 1000 ? Math.round(v / 1000) + 'k' : v) + '</text>';
    }
    rows.forEach((r, i) => {
      const x = L0 + i * bw + bw * 0.18, w = bw * 0.64;
      s += '<rect class="b' + (r.k === selK ? ' sel' : '') + '" data-k="' + r.k + '" x="' + x.toFixed(1) + '" y="' + y(r.p).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (y(0) - y(r.p)).toFixed(1) + '" rx="3"><title>' + esc(r.label + ': ' + L('production ', 'producción ') + eur(r.p) + ', ' + L('collections ', 'cobros ') + eur(r.c)) + '</title></rect>';
      s += '<circle class="dot" cx="' + (x + w / 2).toFixed(1) + '" cy="' + y(r.c).toFixed(1) + '" r="3.5"/>';
      s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(r.short) + '</text>';
    });
    return s + '</svg>';
  }

  function hbars(rows, max, valFmt) {
    return '<div class="hbars">' + rows.map((x) => '<div class="hbar"><span>' + esc(x.label) + '</span><span class="track"><span class="fill' + (x.hot ? ' hot' : '') + '" style="width:' + (100 * Math.max(0, x.v) / max).toFixed(1) + '%;display:block"></span></span><span class="v">' + valFmt(x.v) + (x.sub != null ? '<small>' + x.sub + '</small>' : '') + '</span></div>').join('') + '</div>';
  }
  const auc2 = (x) => x.toFixed(2).replace('.', ',');

  function viewOverview() {
    const ds = S.ds, k = S.k, o = IC.overview(ds, k);
    const prevLbl = IC.mkLabel(k - 1, true), lyLbl = IC.mkLabel(k - 12, true) + ' ' + Math.floor((k - 12) / 12);
    const rows = []; for (let i = ds.lastMonth - 11; i <= ds.lastMonth; i++) rows.push({ k: i, label: IC.mkLabel(i), short: IC.mkLabel(i, true), p: IC.production(ds, i), c: IC.collections(ds, i) });
    const avg6 = (f) => [1, 2, 3, 4, 5, 6].reduce((a, i) => a + f(k - i), 0) / 6;
    // Dentists individually, hygienists as one group
    const profRows = ds.profs.filter((p) => !IC.isHygienist(p)).map((p) => { const v = IC.production(ds, k, null, p), a = avg6((i) => IC.production(ds, i, null, p)); return { label: p, v, a, hot: a > 0 && v < a * 0.75 }; });
    const hyg = ds.profs.filter(IC.isHygienist);
    if (hyg.length) { const v = hyg.reduce((s, p) => s + IC.production(ds, k, null, p), 0), a = avg6((i) => hyg.reduce((s, p) => s + IC.production(ds, i, null, p), 0)); profRows.push({ label: L('Hygienists (', 'Higienistas (') + hyg.length + ')', v, a, hot: a > 0 && v < a * 0.75 }); }
    profRows.sort((x, y) => y.v - x.v);
    const profMax = Math.max(1, ...profRows.map((x) => Math.max(x.v, x.a)));
    const lines = IC.treatmentLines(ds, k, k);
    const top = IC.topPatients(ds, k - 11, k, 8);
    const risk = S.risk.slice(0, 8), high = S.risk.filter((r) => r.tier === 'High');
    const m = S.model, dq = IC.dataQuality(ds);
    const synthetic = ds.source === 'sample';
    const pc = (x) => x == null ? '—' : Math.round(x * 100) + '%';
    const marginCmp = o.marginPct != null && o.marginPctSameMonthLastYear != null ? (function () { const d = (o.marginPct - o.marginPctSameMonthLastYear) * 100; return '<span class="' + (Math.abs(d) < 0.5 ? 'flat' : d > 0 ? 'good' : 'bad') + '">' + (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1).replace('.', ',') + ' ' + L('pts', 'p.p.') + '</span> vs ' + esc(lyLbl); })() : '';

    return '' +
    '<div class="page-head"><div><h1>' + esc(IC.mkLabel(k)) + '</h1><p class="sub">' + L('Data up to ', 'Datos hasta el ') + esc(IC.dayLabel(ds.asOf)) + ' · ' + esc(ds.label) + '</p></div>' +
    '<div class="month-nav"><button class="icon-btn" data-month="-1" aria-label="' + L('Previous month', 'Mes anterior') + '"' + (k <= ds.lastMonth - 11 ? ' disabled' : '') + '>‹</button><button class="icon-btn" data-month="1" aria-label="' + L('Next month', 'Mes siguiente') + '"' + (k >= ds.lastMonth ? ' disabled' : '') + '>›</button></div></div>' +

    '<section class="tiles">' +
      '<div class="tile"><span class="lbl">' + L('Production', 'Producción') + '</span><span class="val">' + eur(o.production) + '</span><span class="cmp">' + delta(o.production, o.productionPrevMonth, true, 'vs ' + prevLbl) + ' · ' + delta(o.production, o.productionSameMonthLastYear, true, 'vs ' + lyLbl) + '</span></div>' +
      '<div class="tile"><span class="lbl">' + L('Margin after materials and lab', 'Margen tras materiales y laboratorio') + '</span><span class="val">' + (o.marginPct == null ? '—' : pct1(o.marginPct)) + '</span><span class="cmp">' + (o.margin == null ? L('No cost data in this import', 'Esta importación no trae costes') : eur(o.margin) + ' · ' + marginCmp) + '</span></div>' +
      '<div class="tile"><span class="lbl">' + L('Paid, not yet done', 'Cobrado, no realizado') + '</span><span class="val">' + eur(o.unearnedRevenue) + '</span><span class="cmp">' + o.unearnedPatients + L(' patients · ', ' pacientes · ') + delta(o.unearnedRevenue, o.unearnedPrevMonthEnd, false, L('vs end of ', 'vs fin de ') + prevLbl) + '</span></div>' +
      '<div class="tile"><span class="lbl">' + L('New patients', 'Pacientes nuevos') + '</span><span class="val">' + o.firstVisits + '</span><span class="cmp">' + delta(o.firstVisits, o.firstVisitsAvgPrior6, true, L('vs 6-month average (', 'vs media de 6 meses (') + Math.round(o.firstVisitsAvgPrior6) + ')') + '</span></div>' +
    '</section>' +

    '<section class="card"><h2>' + L('Production and collections, last 12 months', 'Producción y cobros, últimos 12 meses') + '</h2><p class="def">' + L('Production is treatment done (earned). Collections is money received. Select a bar to change month.', 'Producción es el tratamiento realizado (ganado). Cobros es el dinero recibido. Pulsa una barra para cambiar de mes.') + '</p>' +
      '<div class="chart" id="barChart">' + barChart(rows, k) + '</div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>' + L('Selected month', 'Mes seleccionado') + '</span><span><i style="background:var(--bar)"></i>' + L('Production', 'Producción') + '</span><span><i style="background:var(--ink);border-radius:50%"></i>' + L('Collections', 'Cobros') + '</span></div></section>' +

    '<section class="card"><h2>' + L('Patients likely to abandon their treatment', 'Pacientes con riesgo de abandonar su tratamiento') + '</h2><p class="def">' + L('Patients with accepted treatment not finished, ranked by expected loss (risk × amount pending). Risk is the probability of no progress in the next 90 days.', 'Pacientes con tratamiento aceptado sin terminar, ordenados por pérdida esperada (riesgo × importe pendiente). El riesgo es la probabilidad de no avanzar en los próximos 90 días.') + '</p>' +
      (risk.length ? '<div class="tbl-wrap"><table><thead><tr><th>' + L('Patient', 'Paciente') + '</th><th>' + L('Risk', 'Riesgo') + '</th><th class="r">' + L('Pending', 'Pendiente') + '</th><th class="r">' + L('Already paid', 'Ya pagado') + '</th><th>' + L('Why', 'Por qué') + '</th></tr></thead><tbody>' +
        risk.map((r) => '<tr><td class="pid">Nº ' + r.patient + '</td><td><span class="pill ' + r.tier.toLowerCase() + '">' + Math.round(r.probability * 100) + '%</span></td><td class="r">' + eur(r.pending) + '</td><td class="r">' + eur(r.prepaid) + '</td><td class="why">' + esc(r.reasons.slice(0, 2).join(' · ')) + '</td></tr>').join('') +
        '</tbody></table></div>' : '<p class="sub">' + L('No patients with unfinished treatment in the data.', 'No hay pacientes con tratamiento sin terminar en los datos.') + '</p>') +
      '<p class="note">' + L(high.length + ' patients at high risk (60% or more) hold ' + eur(high.reduce((a, r) => a + r.pending, 0)) + ' of pending treatment, ' + eur(high.reduce((a, r) => a + r.prepaid, 0)) + ' of it already paid.', high.length + ' pacientes con riesgo alto (60% o más) tienen ' + eur(high.reduce((a, r) => a + r.pending, 0)) + ' de tratamiento pendiente, ' + eur(high.reduce((a, r) => a + r.prepaid, 0)) + ' ya pagados.') +
        (S.dormant && S.dormant.patients ? L(' Another ' + S.dormant.patients + ' patients have had no activity for over a year, with ' + eur(S.dormant.pending) + ' pending (' + eur(S.dormant.prepaid) + ' paid); they are not scored.', ' Otros ' + S.dormant.patients + ' pacientes llevan más de un año sin actividad, con ' + eur(S.dormant.pending) + ' pendientes (' + eur(S.dormant.prepaid) + ' pagados); no se puntúan.') : '') + '</p>' +
      (m ? '<p class="note">' + (m.useRule ? L('Using the simple rule this month: the model did not rank patients better than the rule on the latest test.', 'Este mes se usa la regla simple: el modelo no ordenó a los pacientes mejor que la regla en la última prueba.') : L('Risk model retrained on this data: it beats the simple rule (AUC ' + auc2(m.aucModel) + ' against ' + auc2(m.aucRule) + ').', 'Modelo de riesgo reentrenado con estos datos: mejora a la regla simple (AUC ' + auc2(m.aucModel) + ' frente a ' + auc2(m.aucRule) + ').')) + '</p>' +
        '<details class="more"><summary>' + L('How the risk is calculated', 'Cómo se calcula el riesgo') + '</summary><p>' + esc(IC.DEFINITIONS.risk) + '</p><p>' +
        L('Tested on ' + m.testRows + ' patients as of ' + IC.dayLabel(IC.fromIso(m.testDate)) + ', after training on ' + m.trainRows + ' earlier cases. AUC ' + auc2(m.aucModel) + ' for the model against ' + auc2(m.aucRule) + ' for the rule. Of the 20% of patients it rated riskiest, ' + Math.round(m.precisionTop20Model * 100) + '% did stall, against ' + Math.round(m.baseRate * 100) + '% of all patients.',
          'Probado con ' + m.testRows + ' pacientes a ' + IC.dayLabel(IC.fromIso(m.testDate)) + ', tras entrenar con ' + m.trainRows + ' casos anteriores. AUC ' + auc2(m.aucModel) + ' del modelo frente a ' + auc2(m.aucRule) + ' de la regla. Del 20% de pacientes que puntuó con más riesgo, el ' + Math.round(m.precisionTop20Model * 100) + '% se paró, frente al ' + Math.round(m.baseRate * 100) + '% del total.') + '</p>' +
        '<p>' + L('Calibration on that month: average predicted risk ' + Math.round(m.calibration.predictedMean * 100) + '%, observed ' + Math.round(m.calibration.observedRate * 100) + '%. For the riskiest 20%: predicted ' + Math.round(m.calibration.predictedTop20 * 100) + '%, observed ' + Math.round(m.calibration.observedTop20 * 100) + '%.',
          'Calibración en ese mes: riesgo medio previsto ' + Math.round(m.calibration.predictedMean * 100) + '%, observado ' + Math.round(m.calibration.observedRate * 100) + '%. En el 20% con más riesgo: previsto ' + Math.round(m.calibration.predictedTop20 * 100) + '%, observado ' + Math.round(m.calibration.observedTop20 * 100) + '%.') + '</p>' +
        '<p>' + (m.calls.trainingCases ? L('Call results: ' + m.calls.trainingCases + ' training cases had a call in the 30 days before; ' + Math.round(m.calls.stallRateCalled * 100) + '% of them stalled.', 'Resultados de llamada: ' + m.calls.trainingCases + ' casos de entrenamiento tuvieron una llamada en los 30 días anteriores; el ' + Math.round(m.calls.stallRateCalled * 100) + '% se paró.') : L('Call results recorded in the Decisions tab join the training data once 90 days have passed and the outcome is known.', 'Los resultados de llamada anotados en Decisiones entran en el entrenamiento cuando pasan 90 días y se conoce el desenlace.')) + '</p>' +
        (synthetic ? '<p>' + L('With sample data these figures describe the simulation, not the clinic.', 'Con datos de ejemplo estas cifras describen la simulación, no la clínica.') + '</p>' : '') + '</details>' : '') +
    '</section>' +

    '<div class="grid2">' +
      '<section class="card"><h2>' + L('Production by dentist', 'Producción por odontólogo') + '</h2><p class="def">' + esc(IC.mkLabel(k)) + L('. Grey figure: average of the six months before. Red: more than 25% below it.', '. Cifra gris: media de los seis meses anteriores. Rojo: más de un 25% por debajo.') + '</p>' +
        (profRows.length ? hbars(profRows.map((x) => ({ label: x.label, v: x.v, hot: x.hot, sub: eur(x.a) })), profMax, eur) : '<p class="sub">' + L('The data has no professional recorded on treatments.', 'Los datos no traen el profesional en los tratamientos.') + '</p>') +
      '</section>' +
      '<section class="card"><h2>' + L('Treatment lines', 'Líneas de tratamiento') + '</h2><p class="def">' + esc(IC.mkLabel(k)) + L('. Margin is what remains after materials and lab. Change is against ', '. El margen es lo que queda tras materiales y laboratorio. El cambio es frente a ') + esc(lyLbl) + '.</p>' +
        (lines.length ? '<div class="tbl-wrap"><table><thead><tr><th>' + L('Line', 'Línea') + '</th><th class="r">' + L('Done', 'Hechos') + '</th><th class="r">' + L('Production', 'Producción') + '</th><th class="r">' + L('Margin', 'Margen') + '</th><th class="r">' + L('vs last year', 'vs año pasado') + '</th></tr></thead><tbody>' + lines.map((x) => '<tr><td>' + esc(x.line) + '</td><td class="r">' + x.count + '</td><td class="r">' + eur(x.production) + '</td><td class="r">' + pc(x.marginPct) + '</td><td class="r ' + (x.change == null ? 'flat' : x.change >= 0 ? 'good' : 'bad') + '">' + (x.change == null ? '—' : (x.change >= 0 ? '+' : '') + Math.round(x.change * 100) + '%') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="sub">' + L('No treatment done this month.', 'No hay tratamientos realizados este mes.') + '</p>') +
      '</section>' +
      '<section class="card"><h2>' + L('Patients who brought most revenue', 'Pacientes que más ingresos aportaron') + '</h2><p class="def">' + L('Production in the 12 months to ', 'Producción en los 12 meses hasta ') + esc(IC.mkLabel(k)) + '.</p>' +
        (top.length ? '<div class="tbl-wrap"><table><thead><tr><th>' + L('Patient', 'Paciente') + '</th><th class="r">' + L('Treatment done', 'Tratamiento realizado') + '</th></tr></thead><tbody>' + top.map((x) => '<tr><td class="pid">Nº ' + x.patient + '</td><td class="r">' + eur(x.value) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="sub">' + L('No data.', 'Sin datos.') + '</p>') +
      '</section>' +
      '<section class="card"><h2>' + L('Data quality', 'Calidad de los datos') + '</h2><p class="def">' + L('How much of what managers need is recorded, last three months. Low values mean MN entries need the reception recording standard.', 'Cuánto de lo que necesita la dirección está registrado, últimos tres meses. Valores bajos indican que las entradas de MN necesitan el estándar de registro de recepción.') + '</p>' +
        '<div class="tbl-wrap"><table><tbody>' +
          '<tr><td>' + L('Appointments with an outcome (attended, cancelled, no-show)', 'Citas con desenlace (asistió, canceló, no vino)') + '</td><td class="r">' + pc(dq.outcomeRecorded) + '</td></tr>' +
          '<tr><td>' + L('Lost visits recorded (cancelled or no-show)', 'Citas perdidas registradas (cancelación o ausencia)') + '</td><td class="r">' + dq.cancellationsRecorded + '</td></tr>' +
          '<tr><td>' + L('…of them only marked red, reason unknown', '…de ellas solo marcadas en rojo, sin motivo') + '</td><td class="r">' + dq.lostWithoutReason + '</td></tr>' +
          '<tr><td>' + L('Treatments with the professional recorded', 'Tratamientos con el profesional registrado') + '</td><td class="r">' + pc(dq.professionalRecorded) + '</td></tr>' +
          '<tr><td>' + L('Treatments with material and lab cost', 'Tratamientos con coste de materiales y laboratorio') + '</td><td class="r">' + pc(dq.costRecorded) + '</td></tr>' +
          '<tr><td>' + L('New patients counted from registration dates', 'Pacientes nuevos contados por fecha de alta') + '</td><td class="r">' + (dq.patientDates ? L('Yes', 'Sí') : 'No') + '</td></tr>' +
        '</tbody></table></div>' +
        (synthetic ? '<p class="note">' + L('The sample data assumes the recording standard is in place. In the real MN agenda, reception marks outcomes by colour (red: cancelled or no-show; green: done) and leaves the status empty: the September–October 2026 export had 0 cancellations and 4 of 1,503 appointments marked as done. The importer reads the colour.', 'Los datos de ejemplo suponen que el estándar de registro ya se aplica. En la agenda real de MN, recepción marca el desenlace con colores (rojo: canceló o no vino; verde: realizada) y deja el estado vacío: la exportación de septiembre–octubre de 2026 tenía 0 cancelaciones y 4 de 1.503 citas como realizadas. El importador lee el color.') + '</p>' : '') +
      '</section>' +
    '</div>';
  }

  function decisionFor(rec) { return relevant().find((d) => d.recId === rec.id); }
  const decisionLine = (d) => '<span class="pill ' + (d.decision === 'Rejected' ? 'neutral' : 'ok') + '">' + esc(decLabel(d.decision)) + '</span> ' + L('on ', 'el ') + esc(IC.dayLabel(IC.fromIso(d.decidedOn))) + (d.owner ? L(' · owner: ', ' · responsable: ') + esc(d.owner) : '') + (d.decision !== 'Rejected' ? L(' · review on ', ' · revisar el ') + esc(IC.dayLabel(IC.fromIso(d.reviewDay))) : '');
  function trackLine(t) {
    if (!t) return '';
    const parts = [t.decided + L(' decided before', ' decididas antes')];
    if (t.reviewed) parts.push(L(t.worked + ' of ' + t.reviewed + ' reviewed worked' + (t.partly ? ', ' + t.partly + ' partly' : ''), t.worked + ' de ' + t.reviewed + ' revisadas funcionaron' + (t.partly ? ', ' + t.partly + ' en parte' : '')));
    if (t.rejected) parts.push(t.rejected + L(' rejected', ' rechazadas'));
    return '<p class="note">' + L('Track record of this kind: ', 'Historial de este tipo: ') + esc(parts.join(' · ')) + '.</p>';
  }

  function viewRecs() {
    const ds = S.ds;
    const head = '<div class="page-head"><div><h1>' + L('Recommendations', 'Recomendaciones') + '</h1><p class="sub">' + L('From the data up to ', 'Con los datos hasta el ') + esc(IC.dayLabel(ds.asOf)) + L('. You decide. Each decision goes to the log and is checked against the next data import. Kinds of decision that worked before are listed first.', '. Tú decides. Cada decisión va al registro y se comprueba con la siguiente importación. Los tipos de decisión que funcionaron antes aparecen primero.') + '</p></div></div>';
    if (!S.recs.length) return head + '<div class="empty">' + L('Nothing needs a decision in this data.', 'Nada requiere una decisión con estos datos.') + '</div>';
    return head + S.recs.map((r) => {
      const d = decisionFor(r), open = S.open && S.open.recId === r.id ? S.open : null;
      if (d) {
        return '<article class="rec decided"><span class="kind">' + esc(kindLabel(r.kind)) + '</span><h2>' + esc(r.title) + '</h2><p class="decided-line">' + decisionLine(d) + ' · <button class="btn quiet" data-go="decisions">' + L('See in Decisions', 'Ver en Decisiones') + '</button></p></article>';
      }
      const now = IC.evalMetric(ds, r.metric);
      let foot;
      if (open) {
        foot = '<div class="form">' +
          (open.mode === 'Modified' ? '<label>' + L('Your version of the action', 'Tu versión de la acción') + '<textarea id="fAction" rows="3">' + esc(r.action) + '</textarea></label>' : '') +
          (open.mode !== 'Rejected' ? '<div class="row"><label>' + L('Who is responsible', 'Responsable') + '<input id="fOwner" placeholder="' + L('e.g. Reception lead', 'p. ej. Jefa de recepción') + '"></label><label>' + L('Check the result in', 'Revisar el resultado en') + '<select id="fReview"><option value="14">' + L('2 weeks', '2 semanas') + '</option><option value="30" selected>' + L('1 month', '1 mes') + '</option><option value="61">' + L('2 months', '2 meses') + '</option></select></label></div>' : '') +
          '<label>' + (open.mode === 'Rejected' ? L('Why not', 'Por qué no') : L('Note (optional)', 'Nota (opcional)')) + '<textarea id="fNote" rows="2"></textarea></label>' +
          '<div class="actions"><button class="btn primary" data-save="' + esc(r.id) + '">' + (open.mode === 'Rejected' ? L('Save rejection', 'Guardar rechazo') : L('Save decision', 'Guardar decisión')) + '</button><button class="btn quiet" data-cancel="1">' + L('Cancel', 'Cancelar') + '</button></div></div>';
      } else {
        foot = '<div class="actions"><button class="btn primary" data-decide="Accepted" data-rec="' + esc(r.id) + '">' + L('Accept', 'Aceptar') + '</button><button class="btn" data-decide="Modified" data-rec="' + esc(r.id) + '">' + L('Change', 'Modificar') + '</button><button class="btn danger" data-decide="Rejected" data-rec="' + esc(r.id) + '">' + L('Reject', 'Rechazar') + '</button></div>';
      }
      const ids = r.metric.type === 'prepaid_ids' ? '<details class="more"><summary>' + L('See the ', 'Ver los ') + r.metric.ids.length + L(' patients', ' pacientes') + '</summary><p class="ids">' + r.metric.ids.map((id) => 'Nº ' + id).join(' · ') + '</p></details>' : '';
      return '<article class="rec"><span class="kind">' + esc(kindLabel(r.kind)) + '</span><h2>' + esc(r.title) + '</h2><p>' + esc(r.evidence) + '</p>' +
        '<dl><dt>' + L('Suggested action', 'Acción propuesta') + '</dt><dd>' + esc(r.action) + '</dd><dt>' + L('Expected effect', 'Efecto esperado') + '</dt><dd>' + esc(r.impact) + '</dd><dt>' + L('Measured by', 'Se mide con') + '</dt><dd>' + esc(IC.metricLabel(r.metric)) + L(': now ', ': ahora ') + '<b class="num">' + fmt(now, r.metric.fmt) + '</b></dd></dl>' + trackLine(r.track) + ids + foot + '</article>';
    }).join('');
  }

  // What the app has learned from the log so far (feeds the next recommendations).
  function viewLearned() {
    const fu = S.learned && S.learned.followUp, m = S.model, pc = (x) => Math.round(x * 100) + '%';
    const items = [];
    if (fu && fu.callsRecorded) items.push(L(fu.callsRecorded + ' call results recorded; ' + pc(fu.bookedRate) + ' ended in a booking.', fu.callsRecorded + ' resultados de llamada anotados; el ' + pc(fu.bookedRate) + ' acabó en cita.'));
    if (fu && fu.observed) {
      let t = L('Of ' + fu.observed + ' patients on call lists at least four weeks ago, ' + pc(fu.continuedRate) + ' have continued their treatment. The next follow-up recommendation uses this rate.', 'De ' + fu.observed + ' pacientes en listas de llamada de hace al menos cuatro semanas, el ' + pc(fu.continuedRate) + ' ha continuado su tratamiento. La siguiente recomendación de seguimiento usa esta tasa.');
      if (fu.reachedRate != null && fu.notReachedRate != null) t += L(' Reached by phone: ' + pc(fu.reachedRate) + '. No answer: ' + pc(fu.notReachedRate) + '.', ' Contestaron: ' + pc(fu.reachedRate) + '. No contestaron: ' + pc(fu.notReachedRate) + '.');
      items.push(t);
    } else if (fu && fu.decisions) items.push(L('Follow-up results are measured four weeks after each call list; until then recommendations use a stated assumption.', 'Los resultados del seguimiento se miden cuatro semanas después de cada lista de llamadas; hasta entonces las recomendaciones usan una suposición declarada.'));
    const ex = S.learned && S.learned.expectations;
    if (ex && ex.n) {
      const r = ex.avgRealised;
      items.push(L('Your expectations: across ' + ex.n + ' logged decision' + (ex.n > 1 ? 's' : '') + ' with an expected result and at least a month of data, the measured change was on average ' + Math.round(r * 100) + '% of what was expected' + (r < 0.8 ? '. Expectations have been optimistic; consider smaller targets or a different action.' : r > 1.2 ? '. Results have beaten expectations.' : '.'),
        'Vuestras expectativas: en ' + ex.n + ' decisi' + (ex.n > 1 ? 'ones registradas' : 'ón registrada') + ' con resultado esperado y al menos un mes de datos, el cambio medido fue de media el ' + Math.round(r * 100) + '% de lo esperado' + (r < 0.8 ? '. Las expectativas han sido optimistas; conviene fijar metas menores o cambiar la acción.' : r > 1.2 ? '. Los resultados han superado lo esperado.' : '.')));
    }
    if (m) items.push(m.useRule ? L('Risk model: the simple rule is in use because the model did not beat it on the latest test.', 'Modelo de riesgo: se usa la regla simple porque el modelo no la superó en la última prueba.') : L('Risk model retrained on data up to ', 'Modelo de riesgo reentrenado con datos hasta el ') + IC.dayLabel(S.ds.asOf) + (m.calls.trainingCases ? L(', including ' + m.calls.trainingCases + ' cases with a recorded call.', ', con ' + m.calls.trainingCases + ' casos con llamada anotada.') : L('. Call results join its training data once their 90-day outcome is known.', '. Los resultados de llamada entran en el entrenamiento cuando se conoce su desenlace a 90 días.')));
    const kinds = S.learned ? Object.entries(S.learned.byKind).filter(([, s]) => s.reviewed) : [];
    if (kinds.length) items.push(L('Recommendation order now reflects past results: ', 'El orden de las recomendaciones ya refleja resultados pasados: ') + kinds.map(([k, s]) => kindLabel(k) + ' ' + s.worked + '/' + s.reviewed + L(' worked', ' funcionaron')).join(', ') + '.');
    if (!items.length) return '';
    return '<section class="card"><h2>' + L('What the app has learned', 'Lo que la app ha aprendido') + '</h2><ul class="learned">' + items.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul></section>';
  }

  // Metric options for a manager's own decision: clinic-wide metrics, then per treatment line and per dentist.
  function metricOptions() {
    const ds = S.ds, o = (v, l) => '<option value="' + esc(v) + '">' + esc(l) + '</option>';
    let h = '<optgroup label="' + L('Clinic', 'Clínica') + '">' + ['new_patients', 'production', 'margin_pct', 'collections', 'unearned'].map((t) => o(t, IC.METRICS[t].label)).join('') + '</optgroup>';
    if (ds.lineCats.length) h += '<optgroup label="' + L('Treatment line', 'Línea de tratamiento') + '">' + ds.lineCats.map((c) => o('line_production|' + c, IC.metricLabel({ type: 'line_production', line: c }))).join('') + '</optgroup>';
    const dents = ds.profs.filter((p) => !IC.isHygienist(p));
    if (dents.length) h += '<optgroup label="' + L('Dentist', 'Odontólogo') + '">' + dents.map((p) => o('dentist_production|' + p, IC.metricLabel({ type: 'dentist_production', prof: p }))).join('') + '</optgroup>';
    return h;
  }
  function logForm() {
    const kinds = KIND_KEYS.filter((k) => k !== 'risk');
    return '<section class="card form-card"><h2>' + L('Log a decision', 'Registrar una decisión') + '</h2><p class="def">' + L('Record a decision you have taken, what you expect, and how to measure it. The app compares the three months before with the months after.', 'Anota una decisión que hayáis tomado, qué esperáis y cómo medirla. La app compara los tres meses anteriores con los posteriores.') + '</p><div class="form">' +
      '<label>' + L('What did you decide?', '¿Qué habéis decidido?') + '<input id="lTitle" placeholder="' + L('e.g. Instagram giveaway in March', 'p. ej. Sorteo en Instagram en marzo') + '"></label>' +
      '<div class="row"><label>' + L('Type of decision', 'Tipo de decisión') + '<select id="lKind">' + kinds.map((k) => '<option value="' + k + '">' + esc(kindLabel(k)) + '</option>').join('') + '</select></label>' +
      '<label>' + L('Date decided', 'Fecha de la decisión') + '<input id="lDate" type="date" value="' + IC.iso(S.ds.asOf) + '" max="' + IC.iso(S.ds.asOf) + '"></label></div>' +
      '<div class="row"><label>' + L('Measure it by', 'Medir con') + '<select id="lMetric">' + metricOptions() + '</select></label>' +
      '<label>' + L('Expected change (%)', 'Cambio esperado (%)') + '<input id="lExpected" type="number" step="1" placeholder="' + L('e.g. 10 for +10%', 'p. ej. 10 para +10%') + '"></label></div>' +
      '<div class="row"><label>' + L('Who is responsible', 'Responsable') + '<input id="lOwner" placeholder="' + L('e.g. CEO', 'p. ej. Gerencia') + '"></label><label>' + L('Check the result in', 'Revisar el resultado en') + '<select id="lReview"><option value="30">' + L('1 month', '1 mes') + '</option><option value="61" selected>' + L('2 months', '2 meses') + '</option><option value="91">' + L('3 months', '3 meses') + '</option></select></label></div>' +
      '<label>' + L('Why (optional)', 'Por qué (opcional)') + '<textarea id="lWhy" rows="2"></textarea></label>' +
      '<div class="actions"><button class="btn primary" data-logsave="1">' + L('Save decision', 'Guardar decisión') + '</button><button class="btn quiet" data-cancel="1">' + L('Cancel', 'Cancelar') + '</button></div></div></section>';
  }
  const fmtChange = (ch, f) => ch == null ? '—' : f === 'pct' ? (ch >= 0 ? '+' : '−') + Math.abs(ch * 100).toFixed(1).replace('.', ',') + ' ' + L('pts', 'p.p.') : (ch >= 0 ? '+' : '−') + Math.abs(ch * 100).toFixed(0) + '%';
  function evaluationHtml(d) {
    const ev = IC.evalDecision(S.ds, d), f = d.metric.fmt, better = d.metric.better === 'down' ? -1 : 1;
    const cls = (ch) => ch == null || Math.abs(ch) < 0.005 ? 'flat' : ch * better > 0 ? 'good' : 'bad';
    if (ev.kind === 'point') {
      const ch = ev.before ? ev.after / ev.before - 1 : null;
      return '<span>' + L('At decision: ', 'Al decidir: ') + '<b>' + fmt(ev.before, f) + '</b></span><span>' + L('Now: ', 'Ahora: ') + '<b>' + fmt(ev.after, f) + '</b></span><span class="' + cls(ch) + '">' + fmtChange(ch, 'eur') + '</span>';
    }
    let h = '<span>' + L('Before (', 'Antes (') + esc(ev.beforeFrom + '–' + ev.beforeTo) + '): <b>' + fmt(ev.before, f) + '</b></span>';
    if (!ev.afterMonths) return h + '<span>' + L('After: measured from the first full month after the decision.', 'Después: se mide desde el primer mes completo tras la decisión.') + '</span>';
    h += '<span>' + L('After (', 'Después (') + esc(ev.afterFrom + (ev.afterTo !== ev.afterFrom ? '–' + ev.afterTo : '')) + '): <b>' + fmt(ev.after, f) + '</b></span><span class="' + cls(ev.change) + '">' + fmtChange(ev.change, f) + '</span>';
    if (d.expected && d.expected.pct != null) h += '<span>' + L('Expected: ', 'Esperado: ') + fmtChange(d.expected.pct, f) + '</span>';
    if (ev.changeLastYear != null) h += '<span class="note">' + L('Same months a year earlier: ', 'Mismos meses un año antes: ') + fmtChange(ev.changeLastYear, f) + '</span>';
    return h;
  }

  function viewDecisions() {
    const ds = S.ds, all = relevant(), hidden = S.decisions.length - all.length;
    const list = all.slice().sort((a, b) => String(b.decidedOn).localeCompare(String(a.decidedOn)) || String(b.decidedAt).localeCompare(String(a.decidedAt)));
    const acc = list.filter((d) => d.decision !== 'Rejected'), rej = list.length - acc.length;
    const reviewed = acc.filter((d) => d.outcome), worked = reviewed.filter((d) => d.outcome.verdict === 'Worked').length;
    const logging = S.open && S.open.log;
    const head = '<div class="page-head"><div><h1>' + L('Decisions', 'Decisiones') + '</h1><p class="sub">' + L('What was decided, who owns it, and whether it worked. Results are measured on the data currently loaded (up to ', 'Qué se decidió, quién es responsable y si funcionó. Los resultados se miden con los datos cargados (hasta el ') + esc(IC.dayLabel(ds.asOf)) + ').</p></div>' + (logging ? '' : '<button class="btn primary" data-log="1">' + L('Log a decision', 'Registrar una decisión') + '</button>') + '</div>';
    const score = '<div class="score"><div><b>' + list.length + '</b><span>' + L('decisions', 'decisiones') + '</span></div><div><b>' + acc.length + '</b><span>' + L('accepted or changed', 'aceptadas o modificadas') + '</span></div><div><b>' + rej + '</b><span>' + L('rejected', 'rechazadas') + '</span></div><div><b>' + reviewed.length + '</b><span>' + L('results recorded', 'resultados anotados') + '</span></div><div><b>' + worked + '</b><span>' + L('worked', 'funcionaron') + '</span></div></div>';
    const where = '<p class="note">' + (S.store === 'shared' ? L('The log is shared with everyone who opens this app.', 'El registro se comparte con todos los que abren esta app.') : L('The log is saved in this browser only.', 'El registro se guarda solo en este navegador.')) + (hidden ? L(' ' + hidden + ' decisions taken on other data are not shown.', ' No se muestran ' + hidden + ' decisiones tomadas con otros datos.') : '') + (ds.source === 'sample' ? L(' With sample data, patients marked "Booked" are simulated to come back; real results come from the next MN export.', ' Con datos de ejemplo, los pacientes con "Cita reservada" vuelven en la simulación; los resultados reales llegan con la siguiente exportación de MN.') : '') + ' ' + esc(IC.DEFINITIONS.decisionEvaluation) + '</p>';
    const form = logging ? logForm() : '';
    if (!list.length) return head + form + score + '<div class="empty">' + L('No decisions yet. Log a decision you have taken, or decide on a recommendation.', 'Aún no hay decisiones. Registra una decisión que hayáis tomado o decide sobre una recomendación.') + '</div>' + where;
    return head + form + score + viewLearned() + list.map((d) => {
      const due = d.decision !== 'Rejected' && !d.outcome && ds.asOf >= IC.fromIso(d.reviewDay);
      const open = S.open && S.open.decId === d.id;
      let foot = '';
      if (d.outcome) foot = '<p class="decided-line"><span class="pill ' + (d.outcome.verdict === 'Worked' ? 'ok' : d.outcome.verdict === 'Partly' ? 'medium' : 'high') + '">' + esc(verdictLabel(d.outcome.verdict)) + '</span> ' + L('recorded with data up to ', 'anotado con datos hasta el ') + esc(IC.dayLabel(IC.fromIso(d.outcome.asOf))) + ': ' + fmt(d.outcome.value, d.metric.fmt) + (d.outcome.note ? ' · ' + esc(d.outcome.note) : '') + '</p>';
      else if (d.decision !== 'Rejected' && open) foot = '<div class="form"><label>' + L('Did it work?', '¿Funcionó?') + '<select id="fVerdict">' + ['Worked', 'Partly', 'Did not work'].map((v) => '<option value="' + v + '">' + esc(verdictLabel(v)) + '</option>').join('') + '</select></label><label>' + L('What happened (optional)', 'Qué pasó (opcional)') + '<textarea id="fOutNote" rows="2"></textarea></label><div class="actions"><button class="btn primary" data-outcome="' + esc(d.id) + '">' + L('Save result', 'Guardar resultado') + '</button><button class="btn quiet" data-cancel="1">' + L('Cancel', 'Cancelar') + '</button></div></div>';
      else if (d.decision !== 'Rejected') foot = '<div class="actions"><button class="btn' + (due ? ' primary' : '') + '" data-review="' + esc(d.id) + '">' + L('Record result', 'Anotar resultado') + '</button>' + (due ? '<span class="pill medium">' + L('Review due', 'Toca revisar') + '</span>' : '') + '</div>';
      const calls = d.kind === 'risk' && d.decision !== 'Rejected' && d.metric.ids ? callList(d) : '';
      return '<article class="rec"><span class="kind">' + esc(kindLabel(d.kind)) + (d.manual ? L(' · logged by a manager', ' · registrada por la dirección') : L(' · from a recommendation', ' · de una recomendación')) + '</span><h2>' + esc(d.title) + '</h2>' +
        '<p class="decided-line">' + decisionLine(d) + '</p>' +
        '<dl>' + (d.action && d.action !== d.title ? '<dt>' + (d.decision === 'Rejected' ? L('Proposed action', 'Acción propuesta') : L('Action', 'Acción')) + '</dt><dd>' + esc(d.action) + '</dd>' : '') + (d.note ? '<dt>' + (d.decision === 'Rejected' ? L('Reason', 'Motivo') : L('Why', 'Por qué')) + '</dt><dd>' + esc(d.note) + '</dd>' : '') +
        (d.decision !== 'Rejected' ? '<dt>' + esc(IC.metricLabel(d.metric)) + '</dt><dd class="dec-metric">' + evaluationHtml(d) + '</dd>' : '') + '</dl>' + calls + foot + '</article>';
    }).join('') + where;
  }

  function callList(d) {
    const preds = d.predictions || d.metric.ids.map((id) => ({ id, p: null }));
